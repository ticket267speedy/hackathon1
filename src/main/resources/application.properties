server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dbf_hackathon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-very-long-secret-key-please-32b}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@tuckersoft.com}

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50

app.seed.admin.username=${SEED_ADMIN_USER:admin}
app.seed.admin.password=${SEED_ADMIN_PASS:admin123}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@tuckersoft.com}
app.seed.user.username=${SEED_USER_USER:user}
app.seed.user.password=${SEED_USER_PASS:user123}
app.seed.user.email=${SEED_USER_EMAIL:user@tuckersoft.com}
