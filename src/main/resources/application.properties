# ── Servidor ──────────────────────────────────────────────
server.port=8082

# ── Base de datos ─────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/dbf_hackathon
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-very-long-secret-key-for-hs512-32bytes}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ── Mail (Mailtrap / SMTP) ────────────────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@tuckersoft.com}

# ── Async ─────────────────────────────────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# ── Seeder ────────────────────────────────────────────────
app.seed.admin.username=${SEED_ADMIN_USER:admin}
app.seed.admin.password=${SEED_ADMIN_PASS:admin123}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@tuckersoft.com}
app.seed.user.username=${SEED_USER_USER:user}
app.seed.user.password=${SEED_USER_PASS:user123}
app.seed.user.email=${SEED_USER_EMAIL:user@tuckersoft.com}
